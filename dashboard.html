<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Family Hub">
<meta name="theme-color" content="#2f7d4f">
<title>Family Hub</title>
<style>
:root{--bg:#faf8f4;--card:#fff;--tx:#222;--mut:#777;--ac:#2f7d4f;--acx:#fff;--bd:#e6e1d8;--today:#e8f3ec;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#171a18;--card:#222623;--tx:#eee;--mut:#9aa39d;--ac:#5fbf86;--acx:#102016;--bd:#343a36;--today:#1f2e25;color-scheme:dark}}
*{box-sizing:border-box;touch-action:manipulation}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;padding:0;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#boot{padding:16px;color:var(--mut);font-size:16px}
#bar{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--bd);background:var(--card);-webkit-transform:translateY(-120%);transform:translateY(-120%);-webkit-transition:-webkit-transform .2s;transition:transform .2s}
#bar.open{-webkit-transform:translateY(0);transform:translateY(0);box-shadow:0 6px 18px rgba(0,0,0,.25)}
#strip{flex:none;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--mut);cursor:pointer;-webkit-user-select:none;user-select:none}
#bar>*+*{margin-left:10px}
#title{flex:1 1 0px;text-align:center;font-size:21px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{display:flex}
.grp button+button{margin-left:8px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;min-width:56px;min-height:52px;padding:0 14px;-webkit-tap-highlight-color:transparent}
button.on,button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
#panes{flex:1 1 auto;min-height:0;display:flex;flex-direction:row}
#cal{flex:3 1 0px;overflow:hidden;padding:10px;min-height:0;min-width:0;display:flex;flex-direction:column}
#shopp{flex:2 1 0px;position:relative;min-height:0;min-width:0;border-left:1px solid var(--bd)}
@media(orientation:portrait){#panes{flex-direction:column}#cal,#shopp{flex:1 1 0px}#shopp{border-left:0;border-top:1px solid var(--bd)}}
#panes.cal #shopp,#panes.shop #cal{display:none}
#panes.cal #cal,#panes.shop #shopp{flex:1 1 0px}
iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:var(--bg)}
#widgets,#shopview{position:absolute;top:0;left:0;right:0;bottom:0}
#widgets{display:flex;flex-direction:column;padding:10px}
#shopview{display:flex;flex-direction:column;background:var(--bg)}
#widgets.hide,#shopview.hide{display:none}
#shopbar{flex:none;padding:6px 10px;border-bottom:1px solid var(--bd);background:var(--card)}
#shopframe{flex:1 1 0px;position:relative;min-height:0}
.widget{flex:1 1 0px;min-height:0;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 14px;overflow:hidden;display:flex;flex-direction:column;font-size:20px}
.widget:last-child{margin-bottom:0}
#wShop{align-items:center;justify-content:center;text-align:center;cursor:pointer;background:var(--ac);color:var(--acx);border-color:var(--ac);-webkit-user-select:none;user-select:none}
#wShop .wsym{font-size:2.6em;line-height:1.1}
#wShop .wtitle{font-size:1.4em;font-weight:700}
#wShop .wsub{color:var(--acx);opacity:.85}
.wh{flex:none;font-weight:700;font-size:.85em;color:var(--mut);margin-bottom:4px}
.wbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:row;align-items:center;justify-content:center}
.wbody.col{flex-direction:column;text-align:center}
.wmatch{font-size:1.4em;font-weight:700;line-height:1.15;word-wrap:break-word}
.wwhen{font-size:1.05em;font-weight:600;margin-top:.2em}
.wdish{font-size:1.5em;font-weight:700;line-height:1.2;text-align:center;word-wrap:break-word;white-space:pre-wrap}
.wsym{font-size:3em;line-height:1.1}
#wWeather .wsym{margin-right:.35em}
.wtemp{font-size:1.9em;font-weight:700;line-height:1.1}
.wdesc{font-size:1.1em;font-weight:600}
.wsub{font-size:.85em;color:var(--mut)}
#msg{flex:none;color:var(--mut);padding:0 4px 6px}
#msg:empty{display:none}
#week{flex:1 1 0px;min-height:0;display:flex;flex-direction:row}
.wcol{flex:1 1 0px;min-width:0;display:flex;flex-direction:column}
.wcol+.wcol{margin-left:8px}
.day{flex:1 1 0px;min-height:0;margin-bottom:8px}
.wcol>:last-child{margin-bottom:0}
.day{overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 8px}
.day.today{background:var(--today);border-color:var(--ac)}
.dh{font-weight:700;font-size:17px;margin-bottom:6px}
.dh small{color:var(--mut);font-weight:500}
.ev{display:block;width:100%;text-align:left;min-height:0;margin:0 0 4px;padding:4px 7px;border-radius:8px;border:0;border-left:4px solid var(--ac);background:var(--bg);font-size:.88em;line-height:1.2}
.ev.more{text-align:center;color:var(--ac);font-weight:600;margin-bottom:0}
.ev.allday{background:var(--ac);color:var(--acx);border-left-color:var(--ac)}
.ev b{display:block;font-weight:600;word-wrap:break-word}
.ev span{color:var(--mut);font-size:.85em}
.ev.allday span{color:var(--acx)}
.none{color:var(--mut);font-size:.85em}
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.hide{display:none}
.sheet{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:520px;max-height:85vh;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet p{margin:6px 0;word-wrap:break-word}
.sheet input{width:100%;padding:13px;margin:6px 0 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.sheet label{font-weight:600}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;margin-top:6px}
.row button+button{margin-left:10px}
@media(max-width:820px){#title{font-size:17px}button{min-width:48px;padding:0 10px}}

#wArsenal{cursor:pointer}
#wDoor{cursor:pointer}
.doorimg{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
#wDoor .wtitle{font-size:1.4em;font-weight:700}
</style>
</head>
<body>
<div id="boot">Loading… if this message stays, this iPad’s Safari may be too old for this page.</div>
<header id="bar">
  <div class="grp"><button id="prev" aria-label="Previous week">‹</button><button id="today">Today</button><button id="next" aria-label="Next week">›</button></div>
  <div id="title"></div>
  <div class="grp"><button class="m on" data-m="both">Both</button><button class="m" data-m="cal">Calendar</button><button class="m" data-m="shop">Panel</button><button id="reload" aria-label="Refresh">↻</button><button id="gear" aria-label="Settings">⚙︎</button></div>
</header>
<div id="strip" role="button" tabindex="0"><span id="stripTxt"></span></div>
<div id="panes" class="both">
  <section id="cal"><div id="msg"></div><div id="week"></div></section>
  <section id="shopp">
    <div id="widgets">
      <div class="widget" id="wShop" role="button" tabindex="0"><div class="wsym">🛒</div><div class="wtitle">Weekly Shop</div><div class="wsub">Tap to open</div></div>
      <div class="widget" id="wWeather"><div class="wh" id="wwHead">Today’s weather</div><div class="wbody" id="wwBody"><div class="wsub">Loading…</div></div></div>
      <div class="widget" id="wDinner"><div class="wh">🍽️ Tonight’s dinner</div><div class="wbody" id="wdBody"></div></div>
      <div class="widget" id="wArsenal"><div class="wh">⚽ Arsenal · next match</div><div class="wbody col" id="waBody"><div class="wsub">Loading…</div></div></div>
      <div class="widget" id="wDoor"><div class="wh">🔔 Front door</div><div class="wbody col" id="wrBody"></div></div>
    </div>
    <div id="shopview" class="hide">
      <div id="shopbar"><button id="shopBack">‹ Back</button></div>
      <div id="shopframe"><iframe id="shop" allow="camera" title="Weekly Shop"></iframe></div>
    </div>
  </section>
</div>
<div id="modal" class="hide"><div class="sheet" id="sheet"></div></div>
